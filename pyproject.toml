[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "isia_wiki"
version = "0.0.1"
description = "isia_wiki is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog",
    "locust",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.15.0"
features = [
    "splent_io/splent_feature_session_filesystem@v1.1.1",
    "splent_io/splent_feature_settings@v0.2.2",
    "splent_io/splent_feature_media@v0.5.1",
    "splent_io/splent_feature_elasticsearch@v0.1.1",
    "splent_io/splent_feature_skin_lab@v0.2.0",
    "splent_io/splent_feature_theme@v0.4.0",
    "splent_io/splent_feature_auth@v1.9.0",
    "splent_io/splent_feature_search@v0.3.0",
    "splent_io/splent_feature_courses@v0.5.0",
]
features_dev = [
    "splent_io/splent_feature_admin@v1.2.0",
]
features_prod = []
spl = "openwiki_spl"

# Where the SPL model itself comes from. The name above is not enough
# to download anything, so the DOI travels with the product and any
# clone of this repository can resolve the model from UVLHub alone.
[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.21708566"
# Same line, every version. Used to report that a newer model exists.
concept_doi = ""
version = "2"
file = "openwiki_spl.uvl"

[tool.splent.layout]
base_template = "base_template.html"
hooks = [
    "layout.head.css",
    "layout.sidebar.top",
    "layout.anonymous_sidebar",
    "layout.authenticated_sidebar",
    "layout.sidebar.authenticated.items",
    "layout.navbar.anonymous",
    "layout.navbar.authenticated",
    "layout.footer",
    "layout.scripts",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
