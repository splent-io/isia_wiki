[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "isia_wiki"
version = "0.0.1"
description = "isia_wiki is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog",
    "locust",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.15.0"
features = [
    "splent_io/splent_feature_session_filesystem@v1.1.1",
    "splent_io/splent_feature_settings@v0.3.0",
    "splent_io/splent_feature_media@v0.5.1",
    "splent_io/splent_feature_elasticsearch@v0.1.1",
    "splent_io/splent_feature_skin_lab@v0.3.0",
    "splent_io/splent_feature_theme@v0.5.2",
    "splent_io/splent_feature_auth@v1.10.2",
    "splent_io/splent_feature_search@v0.4.1",
    "splent_io/splent_feature_courses@v0.7.1",
]
features_dev = [
    "splent_io/splent_feature_admin@v1.2.0",
]
features_prod = []
spl = "openwiki_spl"

[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.21708566"
concept_doi = ""
version = "2"
file = "openwiki_spl.uvl"

[tool.splent.layout]
base_template = "base_template.html"
hooks = [
    "layout.head.css",
    "layout.sidebar.top",
    "layout.anonymous_sidebar",
    "layout.authenticated_sidebar",
    "layout.sidebar.authenticated.items",
    "layout.navbar.anonymous",
    "layout.navbar.authenticated",
    "layout.footer",
    "layout.scripts",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]

# ── What this product decides about its features ──────────────────────────
# The features declare these and their defaults in their own pyproject; here
# are only the ones this product answers differently. Versioned and reviewable,
# unlike docker/.env, which holds passwords and is not committed.
[tool.splent.config]
SITE_NAME = "isia.us.es"
SEARCH_PLACEHOLDER = "es:Buscar en esta wiki|en:Search this wiki"
AUTH_LOGIN_LAYOUT = "public_base.html"
COURSES_NAME_PREFIX = "ISIA"
COURSES_DESCRIPTION_TEMPLATE = "Material docente de Ingeniería del Software, curso {year}"
COURSES_DEFAULT_CATEGORIES = "Teoría,Prácticas,Proyecto,Evaluación"
